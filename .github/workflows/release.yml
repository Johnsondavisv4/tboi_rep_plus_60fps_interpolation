name: Build release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    name: Build all game versions and publish release
    runs-on: windows-2022
    timeout-minutes: 20
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_TAG: build-${{ github.run_id }}
      RELEASE_COMMIT: ${{ github.sha }}
    steps:
      - name: Check out source and dependencies
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Build and package all supported versions
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $versions = @(Get-Content game-versions.txt | Where-Object { $_.Trim() } | ForEach-Object { $_.Trim() })
          if ($versions.Count -eq 0) { throw 'No supported game versions listed' }
          foreach ($version in $versions) {
            if ($version -notmatch '^\d+\.\d+\.\d+\.\d+$') { throw "Invalid game version: $version" }
            cmake -S . -B "build/$version" -G "Visual Studio 17 2022" -A Win32 "-DGAME_VERSION=$version"
            if ($LASTEXITCODE -ne 0) { throw "Configuration failed for $version" }
            cmake --build "build/$version" --config Release
            if ($LASTEXITCODE -ne 0) { throw "Build failed for $version" }

            $package = "build/package-$version"
            New-Item -ItemType Directory -Path $package -Force | Out-Null
            Copy-Item "build/$version/Release/dinput8.dll" $package
            Copy-Item interpol.ini, README.md $package
            "This DLL is for Repentance+ $version only. Copy dinput8.dll and interpol.ini next to isaac-ng.exe." |
              Set-Content "$package/GAME_VERSION.txt" -Encoding utf8
            $archive = "dist/isaac-interpolation-$version-win32.zip"
            Compress-Archive -Path "$package/*" -DestinationPath $archive -Force
          }
          Get-ChildItem dist -Filter *.zip | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content dist/SHA256SUMS.txt -Encoding ascii

      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $assets = @(Get-ChildItem dist -File | ForEach-Object { $_.FullName })
          gh release view "$env:RELEASE_TAG" --json id
          if ($LASTEXITCODE -ne 0) {
            gh release create "$env:RELEASE_TAG" --target "$env:RELEASE_COMMIT" --draft --generate-notes --title "Isaac interpolation - $env:RELEASE_TAG"
            if ($LASTEXITCODE -ne 0) { throw 'Could not create draft release' }
          }
          gh release upload "$env:RELEASE_TAG" @assets --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload release assets' }
          gh release edit "$env:RELEASE_TAG" --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish release' }
